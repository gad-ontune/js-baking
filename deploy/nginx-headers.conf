# Shared response headers. Included at the server level and in locations that
# add their own headers (add_header is not inherited into those locations).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self'; manifest-src 'self'" always;
add_header X-Content-Type-Options 'nosniff' always;
add_header X-Frame-Options 'DENY' always;
add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(), payment=()' always;
add_header Cross-Origin-Opener-Policy 'same-origin' always;
add_header Cross-Origin-Resource-Policy 'same-origin' always;
add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
