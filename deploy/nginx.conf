worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2m;

    # All writable paths live under directories owned by the jsbh user.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/nginx-headers.conf;

        # API traffic stays on the same origin as the SPA, so session cookies
        # and the CSRF cookie are first-party. X-Forwarded-For is overwritten
        # with the direct peer to stop clients forging rate-limit identities.
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
        }

        location = /health {
            proxy_pass http://backend:8000/health;
            access_log off;
        }

        # The HTML shell must never be cached; hashed assets can be.
        location = /index.html {
            include /etc/nginx/nginx-headers.conf;
            add_header Cache-Control 'no-store' always;
        }

        location /assets/ {
            include /etc/nginx/nginx-headers.conf;
            expires 1y;
            add_header Cache-Control 'public, immutable' always;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
