title = "JS Baking House Gitleaks configuration"

[extend]
useDefault = true

# These files intentionally contain PUBLIC development-only demo credentials,
# placeholders or test fixtures. They are never used in a production deployment.
[allowlist]
paths = [
  '''backend/scripts/seed_demo\.py''',
  '''src/lib/demoCredentials\.js''',
  '''backend/tests/.*''',
  '''tests/.*''',
  '''README\.md''',
  '''SECURITY_ASSESSMENT\.md''',
  '''\.env\.example''',
  '''docker-compose\.yml''',
  '''docker-compose\.demo\.yml''',
  '''deploy/demo\.env\.example''',
  # Contains the public demo credential literal only to assert it is absent
  # from the deployed HTML. It is not a secret.
  '''deploy/security-smoke\.sh''',
]
