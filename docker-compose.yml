name: js-baking-house

# Production-shaped stack: SPA -> nginx -> FastAPI -> PostgreSQL + Redis.
# Copy .env.example to .env and set the required values before starting.
# For the seeded public demo, see docker-compose.demo.yml.

services:
  db:
    build:
      context: .
      dockerfile: deploy/db.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jsbh}
      POSTGRES_USER: ${POSTGRES_USER:-jsbh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [data]
    # The database is not published to the host; use `docker compose exec db psql`
    # for administrative access.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [data]

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Three distinct database identities: bootstrap is used only to create
      # the roles, migrations run as the owner, and the API uses the runtime
      # role, which cannot change audit records or the schema.
      BOOTSTRAP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jsbh}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jsbh}?sslmode=require
      MIGRATION_DATABASE_URL: postgresql+psycopg://${JSBH_OWNER_USER:-jsbh_owner}:${JSBH_OWNER_PASSWORD:?Set JSBH_OWNER_PASSWORD in .env}@db:5432/${POSTGRES_DB:-jsbh}?sslmode=require
      DATABASE_URL: postgresql+psycopg://${JSBH_APP_USER:-jsbh_app}:${JSBH_APP_PASSWORD:?Set JSBH_APP_PASSWORD in .env}@db:5432/${POSTGRES_DB:-jsbh}?sslmode=require
      JSBH_OWNER_USER: ${JSBH_OWNER_USER:-jsbh_owner}
      JSBH_OWNER_PASSWORD: ${JSBH_OWNER_PASSWORD:?Set JSBH_OWNER_PASSWORD in .env}
      JSBH_APP_USER: ${JSBH_APP_USER:-jsbh_app}
      JSBH_APP_PASSWORD: ${JSBH_APP_PASSWORD:?Set JSBH_APP_PASSWORD in .env}
      AUTO_CREATE_SCHEMA: 'false'
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-12}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}

      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      JSBH_API_WORKERS: ${JSBH_API_WORKERS:-2}

      # Empty by default. create_owner.py consumes these once at startup.
      SEED_OWNER_USERNAME: ${SEED_OWNER_USERNAME:-}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      JSBH_ALLOW_DEMO_SEED: ${JSBH_ALLOW_DEMO_SEED:-false}
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3).read()']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [data, web]

  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:8080'
    networks: [web]

volumes:
  pgdata:
  redisdata:

networks:
  web:
  data:
    internal: true
