name: CI

# Security gates run on every push and pull request. The build fails if any
# test, dependency audit, static scan, secret scan or schema check fails.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tests, lint, build, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run audit:npm

  backend:
    name: Backend (tests, pip audit, Bandit, Alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Create virtualenv
        run: python -m venv backend/.venv
      - name: Install dependencies
        run: backend/.venv/bin/pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        run: npm run test:backend
      - name: Audit Python dependencies
        run: npm run audit:pip
      - name: Run Bandit
        run: npm run scan:bandit
      - name: Verify Alembic schema (upgrade + no drift)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/jsbh-ci-schema.db
          AUTO_CREATE_SCHEMA: 'false'
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic current
          .venv/bin/alembic check
      - name: Validate Docker Compose definitions
        run: |
          docker compose --env-file deploy/demo.env.example -f docker-compose.yml -f docker-compose.demo.yml config --quiet
          TLS_DOMAIN=localhost TLS_EMAIL=dev@example.com \
            docker compose --env-file deploy/demo.env.example -f docker-compose.yml -f docker-compose.tls.yml config --quiet
          TRUSTED_PROXY_CIDR=10.0.0.0/8 \
            docker compose --env-file deploy/demo.env.example -f docker-compose.yml -f docker-compose.trusted-proxy.yml config --quiet

  compose-smoke:
    name: Compose stack (security smoke and DB hardening)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the demo stack
        run: |
          docker compose --env-file deploy/demo.env.example \
            -f docker-compose.yml -f docker-compose.demo.yml up --build -d
      - name: Wait for the API to become healthy
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo 'API is healthy'
              exit 0
            fi
            sleep 2
          done
          echo 'API did not become healthy' >&2
          exit 1
      - name: Verify deployed database hardening
        run: |
          docker compose --env-file deploy/demo.env.example \
            -f docker-compose.yml -f docker-compose.demo.yml run --rm \
            --entrypoint python backend backend/scripts/verify_database_hardening.py
      - name: Run automated security smoke checks
        run: BASE_URL=http://127.0.0.1:8080 deploy/security-smoke.sh
      - name: Show stack logs on failure
        if: failure()
        run: |
          docker compose --env-file deploy/demo.env.example \
            -f docker-compose.yml -f docker-compose.demo.yml logs --tail=200

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  static-analysis:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install semgrep
      - name: Run custom rules
        run: semgrep scan --config .semgrep.yml --error --metrics off --quiet
