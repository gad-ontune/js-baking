# TLS overlay. Use with the base stack and real certificates for the domain:
#
#   TLS_DOMAIN=bakery.example.com TLS_EMAIL=ops@example.com \
#     docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Certificates live under ${TLS_CERT_DIR:-./deploy/certs}/live/$TLS_DOMAIN/
# (fullchain.pem and privkey.pem). certbot can issue them with the webroot
# helper in this overlay. Files must be readable by UID 10001.

services:
  web:
    environment:
      JSBH_HTTP_PORT: '80'
      JSBH_REDIRECT_TO_HTTPS: 'return 301 https://$$host$$request_uri;'
      JSBH_HSTS_HEADER: "add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;"
      JSBH_FORWARDED_PROTO: 'proxy_set_header X-Forwarded-Proto https;'
      JSBH_TLS_SERVER: |
        server {
            listen 443 ssl;
            http2 on;
            server_name ${TLS_DOMAIN};
            root /usr/share/nginx/html;
            index index.html;
            ssl_certificate /etc/letsencrypt/live/${TLS_DOMAIN}/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/${TLS_DOMAIN}/privkey.pem;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
            ssl_session_timeout 1d;
            ssl_session_cache shared:SSL:10m;
            ssl_session_tickets off;
            include /etc/nginx/nginx-headers.conf;
            include /etc/nginx/server-locations.conf;
        }
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/letsencrypt:ro
      - certbotwww:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while :; do
          certbot certonly --webroot -w /var/www/certbot \
            -d "${TLS_DOMAIN}" --email "${TLS_EMAIL}" \
            --agree-tos --no-eff-email --keep-until-expiring || true
          chown -R 10001:10001 /etc/letsencrypt/live /etc/letsencrypt/archive 2>/dev/null || true
          chmod -R g+rX /etc/letsencrypt/live /etc/letsencrypt/archive 2>/dev/null || true
          sleep 12h
        done
    volumes:
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/letsencrypt
      - certbotwww:/var/www/certbot

volumes:
  certbotwww:
